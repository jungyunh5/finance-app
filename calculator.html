<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 복리 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;background:#F7F4EF;color:#2C2820;min-height:100vh;padding:24px 20px 48px}
    .page-title{font-size:26px;font-weight:600;color:#2C2820;margin-bottom:4px}
    .page-sub{font-size:13px;font-weight:500;color:#6B4C2A;margin-bottom:18px}
    .nav{display:flex;gap:8px;margin-bottom:18px}
    .nav-btn{flex:1;padding:12px 4px;border-radius:14px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;background:#E8E2D9;color:#A0917F}
    .nav-btn.active{background:#2C2820;color:#F7F4EF}
    .pane{display:none}.pane.active{display:block}
    .subpane{display:none}.subpane.active{display:block}
    .subtabs{display:flex;gap:6px;margin-bottom:14px}
    .subtab{flex:1;padding:11px 6px;border-radius:12px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;background:#F0EBE3;color:#A0917F}
    .subtab.active{background:#8B6F47;color:#fff}
    .card{background:#fff;border-radius:20px;padding:22px 24px;margin-bottom:14px}
    .section-label{font-size:11px;font-weight:600;letter-spacing:.08em;color:#A0917F;text-transform:uppercase;margin-bottom:12px}
    .input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#A0917F;text-transform:uppercase}
    .iw{position:relative;display:flex;align-items:center}
    .iw input{width:100%;background:#F7F4EF;border:none;border-radius:12px;padding:12px 44px 12px 14px;font-size:14px;font-weight:500;color:#2C2820;font-family:'Noto Sans KR',sans-serif;outline:none;transition:background .2s}
    .iw input:focus{background:#EDE8DF}
    .iw input[type=date]{padding-right:14px}
    .unit{position:absolute;right:12px;font-size:12px;font-weight:500;color:#B0A090;pointer-events:none}
    .hint{font-size:11px;color:#C4B09A;margin-top:4px;padding-left:2px;min-height:13px}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .metric{background:#fff;border-radius:16px;padding:16px 18px}
    .metric-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#A0917F;text-transform:uppercase;margin-bottom:5px}
    .metric-value{font-size:19px;font-weight:600;line-height:1.2;color:#2C2820}
    .mv-accent{color:#8B6F47}
    .mv-green{color:#5A8A5A;font-size:17px}
    .mv-red{color:#B94040;font-size:17px}
    .table-card{background:#fff;border-radius:20px;overflow:hidden;margin-bottom:8px}
    .table-head{display:grid;grid-template-columns:44px 1fr 110px 90px;padding:11px 18px;background:#F7F4EF;border-bottom:1.5px solid #EDE8DF}
    .th{font-size:11px;font-weight:600;letter-spacing:.06em;color:#A0917F;text-transform:uppercase}
    .tr{display:grid;grid-template-columns:44px 1fr 110px 90px;padding:12px 18px;border-bottom:1px solid #F7F4EF;align-items:center}
    .tr:last-child{border-bottom:none}
    .tr:hover{background:#FDFCFA}
    .tr.goal{background:#F0EDE6}
    .td{font-size:13px;color:#2C2820}
    .td.num{font-weight:600;color:#A0917F;font-size:12px}
    .td.gain{color:#5A8A5A;font-weight:500;text-align:right}
    .bar-bg{background:#EDE8DF;border-radius:99px;height:5px;overflow:hidden;margin-top:2px}
    .bar-fill{background:linear-gradient(90deg,#C4A882,#8B6F47);height:5px;border-radius:99px}
    .badge{display:inline-block;font-size:10px;font-weight:600;background:#EDE8DF;color:#8B6F47;border-radius:99px;padding:2px 8px;margin-left:6px}
    .badge.goal-badge{background:#2C2820;color:#F7F4EF}
    .empty{padding:28px;text-align:center;color:#B0A090;font-size:13px}
    .more{padding:12px 18px;text-align:center;color:#B0A090;font-size:12px;font-weight:500}
    .trades-badge{display:inline-block;font-size:12px;font-weight:600;color:#8B6F47;background:#EDE8DF;border-radius:99px;padding:4px 14px;margin-top:10px}
    /* 트래커 */
    .tr-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .tr-list-title{font-size:17px;font-weight:600}
    .btn-add{display:flex;align-items:center;gap:6px;padding:10px 16px;background:#2C2820;color:#F7F4EF;border:none;border-radius:12px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
    .challenge-card{background:#fff;border-radius:20px;padding:20px 22px;margin-bottom:12px;cursor:pointer;position:relative}
    .challenge-card:hover{opacity:.95}
    .challenge-card.done-card{border-left:4px solid #5A8A5A}
    .challenge-card.active-card{border-left:4px solid #C4A882}
    .cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .cc-name{font-size:15px;font-weight:600;flex:1;margin-right:8px}
    .cc-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px}
    .status-active{background:#EDE8DF;color:#8B6F47}
    .status-done{background:#EAF3DE;color:#3B6D11}
    .cc-amounts{font-size:13px;font-weight:500;color:#A0917F;margin-bottom:10px}
    .cc-prog-row{display:flex;justify-content:space-between;margin-bottom:6px}
    .cc-prog-label{font-size:12px;color:#A0917F;font-weight:500}
    .cc-prog-pct{font-size:12px;font-weight:600;color:#8B6F47}
    .cc-cur{font-size:13px;font-weight:600;color:#5A8A5A;margin-top:8px}
    .btn-del{position:absolute;top:14px;right:14px;background:none;border:none;font-size:15px;color:#D4C9BC;cursor:pointer}
    .btn-del:hover{color:#B94040}
    .back-btn{display:flex;align-items:center;gap:8px;background:none;border:none;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:600;color:#8B6F47;cursor:pointer;margin-bottom:16px;padding:0}
    .tracker-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .list-card2{background:#fff;border-radius:20px;overflow:hidden;margin-bottom:8px}
    .list-header2{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid #F7F4EF}
    .btn-reset{font-size:11px;font-weight:600;color:#B94040;background:none;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;padding:4px 10px;border-radius:8px}
    .trade-item{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid #F7F4EF;cursor:pointer;user-select:none;transition:background .15s}
    .trade-item:last-child{border-bottom:none}
    .trade-item:hover{background:#FDFCFA}
    .trade-item.done{background:#F9F7F4}
    .check-box{width:22px;height:22px;border-radius:8px;border:2px solid #D4C9BC;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;color:transparent;transition:all .2s}
    .trade-item.done .check-box{background:#2C2820;border-color:#2C2820;color:#F7F4EF}
    .trade-info{flex:1}
    .trade-num{font-size:12px;font-weight:600;color:#A0917F}
    .trade-amt{font-size:14px;font-weight:500;margin-top:1px}
    .trade-item.done .trade-amt{color:#A0917F;text-decoration:line-through}
    .trade-g{font-size:12px;font-weight:600;color:#5A8A5A;white-space:nowrap}
    .trade-item.done .trade-g{color:#C4B09A}
    .empty-challenges{padding:48px 20px;text-align:center;color:#B0A090;font-size:13px;line-height:2;background:#fff;border-radius:20px}
    /* 모달 */
    .modal-overlay{position:fixed;inset:0;background:rgba(44,40,32,.4);z-index:100;display:flex;align-items:flex-end}
    .modal{background:#F7F4EF;border-radius:24px 24px 0 0;padding:24px 20px 40px;width:100%;animation:slideUp .25s ease}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-title{font-size:18px;font-weight:600;margin-bottom:14px}
    .modal-input{width:100%;background:#fff;border:none;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:500;color:#2C2820;font-family:'Noto Sans KR',sans-serif;outline:none;margin-bottom:10px}
    .modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .modal-iw{position:relative;display:flex;align-items:center}
    .modal-iw input{width:100%;background:#fff;border:none;border-radius:12px;padding:12px 50px 12px 14px;font-size:14px;font-weight:500;color:#2C2820;font-family:'Noto Sans KR',sans-serif;outline:none}
    .modal-iw input[type=date]{padding-right:14px}
    .modal-hint{font-size:11px;color:#C4B09A;margin-top:-6px;margin-bottom:6px;padding-left:2px}
    .modal-btns{display:flex;gap:8px;margin-top:14px}
    .btn-cancel{flex:1;padding:14px;background:#E8E2D9;color:#8B6F47;border:none;border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
    .btn-confirm{flex:2;padding:14px;background:#2C2820;color:#F7F4EF;border:none;border-radius:14px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
    /* 계산기 */
    .calc-wrap{display:flex;gap:10px;align-items:flex-start}
    .calc-history-panel{background:#fff;border-radius:20px;padding:16px;width:160px;flex-shrink:0;min-height:420px;display:flex;flex-direction:column}
    .calc-history-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .calc-history-title span{font-size:12px;font-weight:600;color:#A0917F;letter-spacing:.04em}
    .hist-clear{font-size:11px;font-weight:600;color:#B94040;background:none;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
    #bc-history{flex:1;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:2px}
    #bc-history::-webkit-scrollbar{width:0}
    .hist-item{padding:8px 6px;border-radius:10px;cursor:pointer;transition:background .15s}
    .hist-item:hover{background:#F7F4EF}
    .hist-expr{font-size:11px;color:#C4B09A;margin-bottom:2px;word-break:break-all}
    .hist-result{font-size:14px;font-weight:600;color:#2C2820;text-align:right}
    .calc-main{flex:1;min-width:0}
    .calc-screen{background:#fff;border-radius:20px;padding:16px 20px;margin-bottom:10px}
    .calc-expr{font-size:13px;color:#B0A090;text-align:right;min-height:20px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .calc-display{font-size:36px;font-weight:600;color:#2C2820;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .calc-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .cb{height:70px;border:none;border-radius:16px;font-family:'Noto Sans KR',sans-serif;font-size:22px;font-weight:500;cursor:pointer;transition:opacity .1s,transform .1s;background:#EDE8DF;color:#2C2820;display:flex;align-items:center;justify-content:center}
    .cb:active{transform:scale(.93);opacity:.8}
    .cb.fn{background:#D9D2C8}
    .cb.op{background:#8B6F47;color:#fff;font-size:28px}
    .cb.zero{grid-column:span 2;justify-content:flex-start;padding-left:26px}
    .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2C2820;color:#F7F4EF;padding:11px 22px;border-radius:99px;font-size:13px;font-weight:600;font-family:'Noto Sans KR',sans-serif;pointer-events:none;opacity:0;transition:opacity .3s;z-index:999;white-space:nowrap}
    .toast.show{opacity:1}
    html{-webkit-text-size-adjust:100%}
    input,button{-webkit-tap-highlight-color:transparent}
    /* 반응형 */
    @media(max-width:600px){
      body{padding:16px 14px 48px}
      .page-title{font-size:22px}
      .nav-btn{font-size:11px;padding:11px 4px}
      .card{padding:18px 16px}
      .metric{padding:14px 14px}
      .metric-value{font-size:17px}
      .mv-green,.mv-red{font-size:15px}
      .calc-wrap{flex-direction:column}
      .calc-history-panel{width:100%;min-height:auto;order:2}
      #bc-history{flex-direction:column;max-height:200px;overflow-y:auto}
      .calc-main{order:1;width:100%}
      .calc-display{font-size:28px}
      .cb{height:58px;font-size:20px}
      .cb.op{font-size:24px}
      .table-head,.tr{grid-template-columns:36px 1fr 90px 70px;padding:10px 14px}
    }
    @media(min-width:601px) and (max-width:900px){
      body{max-width:700px;margin:0 auto}
      .calc-history-panel{width:180px}
    }
    @media(min-width:901px){
      body{max-width:860px;margin:0 auto;padding:32px 40px 60px}
      .page-title{font-size:30px}
      .nav-btn{font-size:14px;padding:14px 10px}
      .metrics{grid-template-columns:repeat(4,1fr)}
      .calc-history-panel{width:210px;min-height:480px}
      .cb{height:76px;font-size:24px}
      .cb.op{font-size:30px}
      .card{padding:26px 28px}
    }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="page-title">주식 복리 계산기</div>
<div class="page-sub">목표 금액까지 필요한 거래 횟수를 계산합니다</div>

<div class="nav">
  <button class="nav-btn active" onclick="switchNav('calc')">📊 복리 계산기</button>
  <button class="nav-btn" onclick="switchNav('tracker')">✅ 거래 트래커</button>
  <button class="nav-btn" onclick="switchNav('basic')">🔢 계산기</button>
</div>

<!-- 복리 계산기 -->
<div class="pane active" id="pane-calc">
  <div class="subtabs">
    <button class="subtab active" onclick="switchSub('target')">목표 금액 → 횟수</button>
    <button class="subtab" onclick="switchSub('date')">날짜 × 수익률 → 최종 금액</button>
  </div>
  <div class="subpane active" id="sub-target">
    <div class="card">
      <div class="section-label">투자 설정</div>
      <div class="input-grid">
        <div class="field"><label>시작 금액</label><div class="iw"><input type="text" id="t-start" inputmode="numeric"><span class="unit">원</span></div><div class="hint" id="t-sh"></div></div>
        <div class="field"><label>목표 금액</label><div class="iw"><input type="text" id="t-target" inputmode="numeric"><span class="unit">원</span></div><div class="hint" id="t-th"></div></div>
        <div class="field"><label>거래당 수익률</label><div class="iw"><input type="number" id="t-rate" value="5.00" step="0.01" min="0.01" max="100"><span class="unit">%</span></div></div>
        <div class="field"><label>수수료 및 세금</label><div class="iw"><input type="number" id="t-fee" value="0.00" step="0.01" min="0" max="100"><span class="unit">%</span></div></div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">필요 거래 횟수</div><div class="metric-value mv-accent" id="t-count">—</div></div>
      <div class="metric"><div class="metric-label">최종 금액</div><div class="metric-value mv-green" id="t-final">—</div></div>
      <div class="metric"><div class="metric-label">총 수익</div><div class="metric-value mv-red" id="t-profit">—</div></div>
      <div class="metric"><div class="metric-label">총 수익률</div><div class="metric-value mv-red" id="t-pct">—</div></div>
    </div>
    <div class="table-card">
      <div class="table-head"><div class="th">#</div><div class="th">거래 후 금액</div><div class="th" style="text-align:right">실수익</div><div class="th" style="text-align:right;padding-right:4px">진행률</div></div>
      <div id="t-tbody"></div>
    </div>
  </div>
  <div class="subpane" id="sub-date">
    <div class="card">
      <div class="section-label">투자 설정</div>
      <div class="input-grid" style="margin-bottom:10px">
        <div class="field"><label>시작 금액</label><div class="iw"><input type="text" id="d-start" inputmode="numeric"><span class="unit">원</span></div><div class="hint" id="d-sh"></div></div>
        <div class="field"><label>거래당 수익률</label><div class="iw"><input type="number" id="d-rate" value="5.00" step="0.01" min="0.01" max="100"><span class="unit">%</span></div></div>
        <div class="field"><label>수수료 및 세금</label><div class="iw"><input type="number" id="d-fee" value="0.00" step="0.01" min="0" max="100"><span class="unit">%</span></div></div>
        <div class="field"><label>주당 거래 횟수</label><div class="iw"><input type="number" id="d-freq" value="5" step="1" min="1" max="7"><span class="unit">회</span></div></div>
      </div>
      <div class="section-label">거래 기간</div>
      <div class="input-grid">
        <div class="field"><label>시작일</label><div class="iw"><input type="date" id="d-from"></div></div>
        <div class="field"><label>종료일</label><div class="iw"><input type="date" id="d-to"></div></div>
      </div>
      <div id="d-badge"></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">총 거래 횟수</div><div class="metric-value mv-accent" id="d-count">—</div></div>
      <div class="metric"><div class="metric-label">최종 금액</div><div class="metric-value mv-green" id="d-final">—</div></div>
      <div class="metric"><div class="metric-label">총 수익</div><div class="metric-value mv-red" id="d-profit">—</div></div>
      <div class="metric"><div class="metric-label">총 수익률</div><div class="metric-value mv-red" id="d-pct">—</div></div>
    </div>
    <div class="table-card">
      <div class="table-head"><div class="th">#</div><div class="th">거래 후 금액</div><div class="th" style="text-align:right">실수익</div><div class="th" style="text-align:right;padding-right:4px">누적 수익률</div></div>
      <div id="d-tbody"></div>
    </div>
  </div>
</div>

<!-- 트래커 -->
<div class="pane" id="pane-tracker">
  <div id="tr-list-view">
    <div class="tr-list-header">
      <span class="tr-list-title">진행 중인 도전</span>
      <button class="btn-add" onclick="openModal()">＋ 새 도전</button>
    </div>
    <div id="challenges-container"></div>
  </div>
  <div id="tr-detail-view" style="display:none">
    <button class="back-btn" onclick="backToList()">← 목록으로</button>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px">
        <span style="font-size:16px;font-weight:600" id="det-name"></span>
        <span style="font-size:13px;font-weight:600;color:#8B6F47" id="det-pct-top"></span>
      </div>
      <div class="bar-bg"><div class="bar-fill" id="det-prog-fill" style="width:0%"></div></div>
      <div style="font-size:12px;color:#A0917F;margin-top:6px" id="det-prog-label"></div>
    </div>
    <div class="tracker-metrics">
      <div class="metric"><div class="metric-label">현재 금액</div><div class="metric-value mv-green" id="det-cur">—</div></div>
      <div class="metric"><div class="metric-label">남은 횟수</div><div class="metric-value mv-accent" id="det-remain">—</div></div>
      <div class="metric"><div class="metric-label">수익률</div><div class="metric-value mv-red" id="det-gain-pct">—</div></div>
    </div>
    <div class="list-card2">
      <div class="list-header2">
        <span style="font-size:13px;font-weight:600" id="det-list-title">거래 목록</span>
        <button class="btn-reset" onclick="resetChallenge()">체크 초기화</button>
      </div>
      <div id="det-trade-list"></div>
    </div>
  </div>
</div>

<!-- 계산기 -->
<div class="pane" id="pane-basic">
  <div class="calc-wrap">
    <div class="calc-history-panel">
      <div class="calc-history-title">
        <span>기록</span>
        <button class="hist-clear" onclick="bcHistory=[];bcShow()">지우기</button>
      </div>
      <div id="bc-history"></div>
    </div>
    <div class="calc-main">
      <div class="calc-screen">
        <div class="calc-expr" id="bc-expr">&nbsp;</div>

<script>
const ac=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
const st=s=>s.replace(/,/g,'');
const fmtKr=v=>{if(!v||isNaN(v))return'';const n=Math.round(v),uk=Math.floor(n/1e8),man=Math.floor((n%1e8)/1e4),rem=n%1e4;const p=[];if(uk)p.push(uk+'억');if(man)p.push(man.toLocaleString()+'만');if(rem||!p.length)p.push(rem.toLocaleString());return p.join(' ')+'원';};
const fmtShort=v=>{if(v>=1e8)return(v/1e8).toFixed(1).replace(/\.0$/,'')+'억';if(v>=1e4)return Math.round(v/1e4)+'만';return Math.round(v).toLocaleString()+'원';};
const fd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const getRaw=id=>parseFloat(st(document.getElementById(id).value))||0;
const showToast=msg=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);};

/* Firebase 초기화 */
const firebaseConfig = {
  databaseURL: "https://calculator-b036e-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* localStorage 대신 Firebase 사용 */
const storage = {
  get: (key) => new Promise(resolve => {
    db.ref(key).once('value', snap => resolve(snap.val() ? {value: snap.val()} : null));
  }),
  set: (key, val) => db.ref(key).set(val),
};

/* 실시간 동기화 — 다른 기기에서 변경되면 자동 반영 */
db.ref('multi-tracker-v2').on('value', snap => {
  if (snap.val()) {
    try {
      const data = JSON.parse(snap.val());
      challenges = data;
      if (activeId) renderDetail();
      else renderChallengeList();
    } catch(e) {}
  }
});

function moneyInput(id,hid,cb){
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{
    const pos=el.selectionStart,before=el.value.length,raw=st(el.value).replace(/[^\d]/g,'');
    el.value=raw?ac(raw):'';const d=el.value.length-before;el.setSelectionRange(pos+d,pos+d);
    if(hid)document.getElementById(hid).textContent=raw?fmtKr(+raw):'';
    if(cb)cb();
  });
}
function setMoney(id,val,hid){document.getElementById(id).value=ac(String(val));if(hid)document.getElementById(hid).textContent=fmtKr(val);}

function switchNav(tab){['calc','tracker','basic'].forEach((t,i)=>{document.querySelectorAll('.nav-btn')[i].classList.toggle('active',t===tab);document.getElementById('pane-'+t).classList.toggle('active',t===tab);});}
function switchSub(s){document.querySelectorAll('.subtab').forEach((b,i)=>b.classList.toggle('active',i===(s==='target'?0:1)));document.getElementById('sub-target').classList.toggle('active',s==='target');document.getElementById('sub-date').classList.toggle('active',s==='date');}

function renderCalcTable(tbid,rows,start,target,showBar){
  const SHOW=Math.min(rows.length,60),ms=[1e8,2e8,5e8,1e9,5e9,1e10],shown=new Set();
  let html='';
  rows.slice(0,SHOW).forEach((r,i)=>{
    const pct=showBar?Math.min(100,((r.val-start)/(target-start))*100):(r.val/start-1)*100;
    const isGoal=showBar&&r.val>=target&&i===rows.findIndex(x=>x.val>=target);
    let badge='';ms.forEach(m=>{if(!shown.has(m)&&r.val>=m){shown.add(m);badge=`<span class="badge${isGoal?' goal-badge':''}">${fmtKr(m)}</span>`;}});
    const right=showBar?`<div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,pct).toFixed(1)}%"></div></div>`:`+${pct.toFixed(1)}%`;
    html+=`<div class="tr${isGoal?' goal':''}"><div class="td num">${r.n}</div><div class="td">${fmtKr(r.val)}${badge}</div><div class="td gain">+${fmtKr(r.net)}</div><div class="td" style="text-align:right;padding-right:4px;font-size:12px;color:#A0917F">${right}</div></div>`;
  });
  if(rows.length>SHOW)html+=`<div class="more">+${rows.length-SHOW}회 더 있음</div>`;
  document.getElementById(tbid).innerHTML=html||'<div class="empty">결과 없음</div>';
}

function calcTarget(){
  const start=getRaw('t-start'),target=getRaw('t-target'),rate=parseFloat(document.getElementById('t-rate').value)||0,fee=parseFloat(document.getElementById('t-fee').value)||0,nr=(rate-fee)/100;
  if(!start||!target||target<=start||nr<=0){['t-count','t-final','t-profit','t-pct'].forEach(id=>document.getElementById(id).textContent='—');document.getElementById('t-tbody').innerHTML='<div class="empty">올바른 값을 입력해주세요</div>';return;}
  let cur=start,rows=[],n=0;while(cur<target&&n<500){n++;const net=cur*nr;cur+=net;rows.push({n,val:cur,net});}
  document.getElementById('t-count').textContent=n+'번';document.getElementById('t-final').textContent=fmtKr(cur);document.getElementById('t-profit').textContent='+'+fmtKr(cur-start);document.getElementById('t-pct').textContent='+'+((cur/start-1)*100).toFixed(1)+'%';
  renderCalcTable('t-tbody',rows,start,target,true);
}

function calcDate(){
  const start=getRaw('d-start'),rate=parseFloat(document.getElementById('d-rate').value)||0,fee=parseFloat(document.getElementById('d-fee').value)||0,freq=parseInt(document.getElementById('d-freq').value)||5,from=document.getElementById('d-from').value,to=document.getElementById('d-to').value;
  if(!from||!to||!start||!rate){['d-count','d-final','d-profit','d-pct'].forEach(id=>document.getElementById(id).textContent='—');document.getElementById('d-badge').innerHTML='';document.getElementById('d-tbody').innerHTML='<div class="empty">날짜와 값을 입력해주세요</div>';return;}
  const df=new Date(from),dt=new Date(to);if(dt<=df)return;
  const weeks=(dt-df)/(1000*60*60*24*7),n=Math.round(weeks*freq);
  document.getElementById('d-badge').innerHTML=`<span class="trades-badge">총 ${n}회 거래 (${Math.round(weeks*10)/10}주)</span>`;
  const nr=(rate-fee)/100;if(nr<=0)return;
  let cur=start,rows=[];for(let i=1;i<=n;i++){const net=cur*nr;cur+=net;rows.push({n:i,val:cur,net});}
  document.getElementById('d-count').textContent=n+'번';document.getElementById('d-final').textContent=fmtKr(cur);document.getElementById('d-profit').textContent='+'+fmtKr(cur-start);document.getElementById('d-pct').textContent='+'+((cur/start-1)*100).toFixed(1)+'%';
  renderCalcTable('d-tbody',rows,start,cur,false);
}

setMoney('t-start',25000000,'t-sh');moneyInput('t-start','t-sh',calcTarget);
setMoney('t-target',100000000,'t-th');moneyInput('t-target','t-th',calcTarget);
setMoney('d-start',25000000,'d-sh');moneyInput('d-start','d-sh',calcDate);
document.querySelectorAll('#sub-target input[type=number]').forEach(el=>el.addEventListener('input',calcTarget));
document.querySelectorAll('#sub-date input[type=number],#sub-date input[type=date]').forEach(el=>el.addEventListener('input',calcDate));
const today=new Date(),later=new Date();later.setMonth(later.getMonth()+3);
document.getElementById('d-from').value=fd(today);document.getElementById('d-to').value=fd(later);
calcTarget();calcDate();

/* 트래커 */
let challenges=[],activeId=null;
const SK='multi-tracker-v2';
function loadChallenges(){
  db.ref(SK).once('value', snap => {
    try { if(snap.val()) challenges = JSON.parse(snap.val()); } catch(e) {}
    renderChallengeList();
  });
}
async function saveChallenges(){ db.ref(SK).set(JSON.stringify(challenges)); }
function buildTrades(start,target,nr){let cur=start,trades=[],n=0;while(cur<target&&n<500){n++;const net=cur*nr;cur+=net;trades.push({n,val:cur,net,sv:cur-net});}return trades;}

let modalMode='target';
function switchModalTab(mode){
  modalMode=mode;
  document.getElementById('m-tab1').style.cssText=`flex:1;padding:9px;border-radius:10px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;background:${mode==='target'?'#2C2820':'#F0EBE3'};color:${mode==='target'?'#F7F4EF':'#A0917F'}`;
  document.getElementById('m-tab2').style.cssText=`flex:1;padding:9px;border-radius:10px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:600;cursor:pointer;background:${mode==='date'?'#2C2820':'#F0EBE3'};color:${mode==='date'?'#F7F4EF':'#A0917F'}`;
  document.getElementById('m-pane-target').style.display=mode==='target'?'block':'none';
  document.getElementById('m-pane-date').style.display=mode==='date'?'block':'none';
}
moneyInput('m-start','m-sh');moneyInput('m-target-i','m-th');moneyInput('m-dstart','m-dsh');
function updateModalDateTrades(){const n=parseInt(document.getElementById('m-dfreq').value)||0,from=document.getElementById('m-dfrom').value,to=document.getElementById('m-dto').value,el=document.getElementById('m-dtrades');if(from&&to){const df=new Date(from),dt=new Date(to);if(dt>df){el.textContent=`${Math.round((dt-df)/(1000*60*60*24))}일 기간 · 총 ${n}회 거래`;return;}}el.textContent=n?`총 ${n}회 거래`:''; }
['m-dfrom','m-dto','m-dfreq'].forEach(id=>document.getElementById(id).addEventListener('input',updateModalDateTrades));
const mToday=new Date(),mLater=new Date();mLater.setMonth(mLater.getMonth()+3);
document.getElementById('m-dfrom').value=fd(mToday);document.getElementById('m-dto').value=fd(mLater);

function openModal(){document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';['m-name','m-start','m-target-i','m-dstart'].forEach(id=>document.getElementById(id).value='');['m-sh','m-th','m-dsh'].forEach(id=>document.getElementById(id).textContent='');switchModalTab('target');}
function closeModalOut(e){if(e.target===document.getElementById('modal'))closeModal();}

function addChallenge(){
  const name=document.getElementById('m-name').value.trim()||('도전 '+(challenges.length+1));
  let trades,start,target;
  if(modalMode==='target'){
    start=parseFloat(st(document.getElementById('m-start').value))||0;target=parseFloat(st(document.getElementById('m-target-i').value))||0;
    const rate=parseFloat(document.getElementById('m-rate').value)||0,fee=parseFloat(document.getElementById('m-fee').value)||0,nr=(rate-fee)/100;
    if(!start||!target||target<=start||nr<=0){showToast('올바른 값을 입력해주세요');return;}
    trades=buildTrades(start,target,nr);
  }else{
    start=parseFloat(st(document.getElementById('m-dstart').value))||0;
    const rate=parseFloat(document.getElementById('m-drate').value)||0,fee=parseFloat(document.getElementById('m-dfee').value)||0,n=parseInt(document.getElementById('m-dfreq').value)||0,nr=(rate-fee)/100;
    if(!start||n<=0||nr<=0){showToast('올바른 값을 입력해주세요');return;}
    let cur=start;trades=[];for(let i=1;i<=n;i++){const net=cur*nr;cur+=net;trades.push({n:i,val:cur,net,sv:cur-net});}
    target=trades.length?trades[trades.length-1].val:start;
  }
  challenges.unshift({id:Date.now().toString(),name,start,target,trades,checked:[],createdAt:new Date().toLocaleDateString('ko-KR')});
  saveChallenges();renderChallengeList();closeModal();showToast('✅ 도전이 추가됐어요!');
}

function renderChallengeList(){
  const el=document.getElementById('challenges-container');
  if(!challenges.length){el.innerHTML='<div class="empty-challenges">아직 진행 중인 도전이 없어요<br><span style="font-size:28px">🎯</span><br>새 도전을 추가해보세요</div>';return;}
  el.innerHTML=challenges.map(c=>{const done=c.checked.length,total=c.trades.length,pct=total?Math.round(done/total*100):0,isDone=pct>=100,last=c.checked.length?Math.max(...c.checked):0,curVal=last?c.trades[last-1].val:c.start;
    return`<div class="challenge-card ${isDone?'done-card':'active-card'}" onclick="openDetail('${c.id}')"><button class="btn-del" onclick="event.stopPropagation();deleteChallenge('${c.id}')">✕</button><div class="cc-top"><div class="cc-name">${c.name}</div><span class="cc-status ${isDone?'status-done':'status-active'}">${isDone?'달성':'진행중'}</span></div><div class="cc-amounts">${fmtShort(c.start)} → <strong>${fmtShort(c.target)}</strong> &nbsp;·&nbsp; <span style="font-size:12px">${c.createdAt}</span></div><div class="cc-prog-row"><span class="cc-prog-label">${done} / ${total}회 완료</span><span class="cc-prog-pct">${pct}%</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><div class="cc-cur">${fmtKr(curVal)}</div></div>`;
  }).join('');
}

function openDetail(id){activeId=id;document.getElementById('tr-list-view').style.display='none';document.getElementById('tr-detail-view').style.display='block';renderDetail();}
function backToList(){document.getElementById('tr-list-view').style.display='block';document.getElementById('tr-detail-view').style.display='none';activeId=null;renderChallengeList();}

function renderDetail(){
  const c=challenges.find(x=>x.id===activeId);if(!c)return;
  const done=c.checked.length,total=c.trades.length,pct=total?Math.round(done/total*100):0,last=c.checked.length?Math.max(...c.checked):0,curVal=last?c.trades[last-1].val:c.start,gp=c.start?((curVal/c.start-1)*100):0;
  document.getElementById('det-name').textContent=c.name;document.getElementById('det-pct-top').textContent=pct+'%';document.getElementById('det-prog-fill').style.width=pct+'%';document.getElementById('det-prog-label').textContent=`${done} / ${total}회 완료 · ${c.createdAt} 시작`;document.getElementById('det-cur').textContent=fmtKr(curVal);document.getElementById('det-remain').textContent=(total-done)+'번';document.getElementById('det-gain-pct').textContent=(gp>=0?'+':'')+gp.toFixed(1)+'%';document.getElementById('det-list-title').textContent=`거래 목록 (총 ${total}회)`;
  const cs=new Set(c.checked);
  document.getElementById('det-trade-list').innerHTML=c.trades.map(t=>{const isDone=cs.has(t.n);return`<div class="trade-item${isDone?' done':''}" onclick="toggleTrade('${c.id}',${t.n})"><div class="check-box">${isDone?'✓':''}</div><div class="trade-info"><div class="trade-num">거래 ${t.n}회차</div><div class="trade-amt">${fmtKr(t.val)}</div></div><div class="trade-g">+${fmtKr(t.net)}</div></div>`;}).join('');
}

function toggleTrade(id,n){const c=challenges.find(x=>x.id===id);if(!c)return;const idx=c.checked.indexOf(n);if(idx>=0)c.checked.splice(idx,1);else{c.checked.push(n);if(c.checked.length===c.trades.length)showToast('🎉 목표 달성! 축하해요!');else if(c.checked.length===Math.floor(c.trades.length/2))showToast('💪 절반 완료! 화이팅!');}saveChallenges();renderDetail();}
function resetChallenge(){if(!confirm('체크 기록을 초기화할까요?'))return;const c=challenges.find(x=>x.id===activeId);if(!c)return;c.checked=[];saveChallenges();renderDetail();}
function deleteChallenge(id){if(!confirm('이 도전을 삭제할까요?'))return;challenges=challenges.filter(x=>x.id!==id);saveChallenges();renderChallengeList();}

/* 계산기 */
let bcVal='0',bcPrev=null,bcOper=null,bcFresh=true,bcExpr='',bcHistory=[];
const fmtNum=v=>{const n=parseFloat(v);return isNaN(n)?v:n.toLocaleString('ko-KR',{maximumFractionDigits:10});};
function bcShow(){document.getElementById('bc-display').textContent=bcVal==='오류'?'오류':fmtNum(bcVal);document.getElementById('bc-expr').textContent=bcExpr||'\u00a0';renderHistory();}
function renderHistory(){const el=document.getElementById('bc-history');if(!bcHistory.length){el.innerHTML='<div style="font-size:12px;color:#D4C9BC;text-align:center;margin-top:20px">기록 없음</div>';return;}el.innerHTML=[...bcHistory].reverse().map((h,i)=>`<div class="hist-item" onclick="bcUseHistory(${bcHistory.length-1-i})"><div class="hist-expr">${h.expr}</div><div class="hist-result">${fmtNum(String(h.result))}</div></div>`).join('');}
function bcUseHistory(i){bcVal=String(bcHistory[i].result);bcFresh=true;bcExpr='';bcShow();}
function bcNum(d){if(bcFresh){bcVal=d;bcFresh=false;}else bcVal=bcVal==='0'?d:bcVal+d;bcShow();}
function bcDot(){if(bcFresh){bcVal='0.';bcFresh=false;}else if(!bcVal.includes('.'))bcVal+='.';bcShow();}
function bcOp(op){if(bcPrev!==null&&!bcFresh)bcCalc(false);bcPrev=parseFloat(bcVal);bcOper=op;bcFresh=true;bcExpr=fmtNum(bcVal)+' '+op;bcShow();}
function bcCalc(addH){if(bcPrev===null||bcOper===null)return;const cur=parseFloat(bcVal),p=bcPrev;let res;if(bcOper==='+')res=p+cur;else if(bcOper==='−')res=p-cur;else if(bcOper==='×')res=p*cur;else if(bcOper==='÷')res=cur===0?'오류':p/cur;const expr=`${fmtNum(String(p))} ${bcOper} ${fmtNum(bcVal)}`;bcVal=res==='오류'?'오류':String(+res.toFixed(10));if(addH&&res!=='오류')bcHistory.push({expr:expr+' =',result:parseFloat(bcVal)});bcPrev=null;bcOper=null;bcFresh=true;}
function bcEqual(){if(bcPrev===null)return;bcExpr=bcExpr+' '+fmtNum(bcVal)+' =';bcCalc(true);bcShow();}
function bcAC(){bcVal='0';bcPrev=null;bcOper=null;bcFresh=true;bcExpr='';bcShow();}
function bcToggle(){if(bcVal!=='오류'&&bcVal!=='0')bcVal=String(-parseFloat(bcVal));bcShow();}
function bcPct(){if(bcVal!=='오류')bcVal=String(parseFloat(bcVal)/100);bcShow();}
document.addEventListener('keydown',e=>{if(!document.getElementById('pane-basic').classList.contains('active'))return;if(e.key>='0'&&e.key<='9')bcNum(e.key);else if(e.key==='.')bcDot();else if(e.key==='+')bcOp('+');else if(e.key==='-')bcOp('−');else if(e.key==='*')bcOp('×');else if(e.key==='/'){e.preventDefault();bcOp('÷');}else if(e.key==='Enter'||e.key==='=')bcEqual();else if(e.key==='Escape')bcAC();else if(e.key==='Backspace'){if(!bcFresh&&bcVal.length>1)bcVal=bcVal.slice(0,-1);else bcVal='0';bcShow();}});

loadChallenges();
</script>
